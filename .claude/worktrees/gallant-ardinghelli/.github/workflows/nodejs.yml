name: Node CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 19
        uses: actions/setup-node@v3
        with:
          node-version: 19
          cache: 'npm'  # Caches node_modules + package-lock.json for faster runs

      - name: Install dependencies
        run: npm ci  # Uses package-lock.json for exact, reproducible installs

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          CI: true